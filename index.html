<title>Shaheen International Pharma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap">
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#e3e8f0;--pri:#0b7a6b;--pri2:#e8f6f3;--acc:#f59e0b;--hd:#0b3d5c;--img:#f1f4f9;--wa:#25d366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1621;--card:#18222f;--ink:#eef2f7;--mut:#9aa7b8;--line:#2a3646;--pri:#2fc4ad;--pri2:#13302d;--hd:#06223a;--img:#e9eef5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1621;--card:#18222f;--ink:#eef2f7;--mut:#9aa7b8;--line:#2a3646;--pri:#2fc4ad;--pri2:#13302d;--hd:#06223a;--img:#e9eef5;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.ur{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",system-ui,serif;line-height:2.1}
.w{max-width:1040px;margin:0 auto;padding:0 18px}
header{background:var(--hd);color:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px}.logo small{display:block;font-weight:500;font-size:12px;opacity:.75}
.nb{display:flex;gap:8px;flex-wrap:wrap}
.nb a,.nb button{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.4);padding:7px 13px;border-radius:99px;text-decoration:none;font:inherit;font-size:14px;cursor:pointer;line-height:1.5}
.hero{padding:30px 0 46px}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.25;margin:0 0 12px}
.hero p{max-width:560px;opacity:.9;margin:0 0 22px}
.btn{display:inline-block;background:var(--acc);color:#1b1300;font-weight:700;border:0;padding:13px 22px;border-radius:12px;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}
.btn.p{background:var(--pri);color:#fff}.btn.o{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.w{background:var(--wa);color:#05260f}
.trust{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;font-size:13px}
.trust span{background:rgba(255,255,255,.12);padding:4px 12px;border-radius:99px}
section{padding:34px 0}
h2{font-size:26px;margin:0 0 6px}.sub{color:var(--mut);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column}
.tag{display:inline-block;font-size:12px;font-weight:600;background:var(--pri2);color:var(--pri);padding:2px 10px;border-radius:99px;align-self:flex-start}
.ph{height:190px;overflow:hidden;position:relative;background:var(--img);border-radius:12px;margin:10px 0;display:flex;align-items:center;justify-content:center;padding:10px}
.ph img{display:block;height:165px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.card h3{margin:2px 0 0;font-size:21px}.gen{color:var(--mut);font-size:13px;margin-bottom:8px}
.card ul{margin:6px 0 12px;padding-inline-start:18px;font-size:14px;flex:1}
.pr{font-size:22px;font-weight:800;color:var(--pri)}.pr small{font-weight:500;color:var(--mut);font-size:13px}
.qty{display:flex;align-items:center;gap:8px;margin-top:10px}
.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.qty input{width:56px;height:38px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px}
.card .btn{margin-top:10px;width:100%;text-align:center}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input.f,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.tot{font-weight:800;font-size:18px;border:0;padding-top:12px}
.empty{color:var(--mut);padding:10px 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.steps div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.steps b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;margin-bottom:6px}
.steps span{display:block;color:var(--mut);font-size:14px}
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ct a,.ct div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink);text-decoration:none}
.ct small{display:block;color:var(--mut)}
.msg{font-size:14px;margin-top:10px;color:var(--pri);font-weight:600;min-height:20px}.err{color:#d6336c}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--wa);color:#05260f;font-weight:700;padding:12px 18px;border-radius:99px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5}

function render(){var h="",t=0;P.forEach(function(x){if(Q[x.id]>0){var s=Q[x.id]*x.p;t+=s;h+='<div class="row"><span dir="auto">'+x.n+' '+x.s+' × '+Q[x.id]+'</span><span>'+fmt(s)+' <button data-rm="'+x.id+'" aria-label="Remove" style="border:0;background:none;color:#d6336c;cursor:pointer;font-size:16px">✕</button></span></div>'}});
$("list").innerHTML='<strong>'+T("yi")+'</strong>'+(h?h+'<div class="row tot"><span>'+T("tot")+'</span><span>'+fmt(t)+'</span></div>':'<div class="empty">'+T("emp")+'</div>')}
$("list").addEventListener("click",function(e){var b=e.target.closest("[data-rm]");if(b){Q[b.dataset.rm]=0;render()}});
function applyLang(){var r=document.documentElement;r.lang=L;r.dir=L=="ur"?"rtl":"ltr";document.body.className=L=="ur"?"ur":"";
document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=T(e.dataset.t)});
$("lang").textContent=T("lang");$("fab").textContent=T("wa");drawGrid();render()}
$("lang").onclick=function(){L=L=="en"?"ur":"en";try{localStorage.setItem("lang",L)}catch(e){}applyLang()};
function isDark(){var t=document.documentElement.dataset.theme;return t?t=="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function setIcon(){$("theme").textContent=isDark()?"☀️":"🌙"}
$("theme").onclick=function(){var d=!isDark();document.documentElement.dataset.theme=d?"dark":"light";try{localStorage.setItem("theme",d?"dark":"light")}catch(e){}setIcon()};
try{var st=localStorage.getItem("theme");if(st)document.documentElement.dataset.theme=st}catch(e){}
function build(){var l=["Assalam-o-Alaikum, I would like to inquire about:",""],t=0;
P.forEach(function(x){if(Q[x.id]>0){l.push("• "+x.n+" "+x.s+" × "+Q[x.id]+" = "+fmtE(Q[x.id]*x.p));t+=Q[x.id]*x.p}});
l.push("","Estimated total: "+fmtE(t),"","Name: "+$("nm").value.trim(),"Phone: "+$("ph").value.trim());
if($("ct").value.trim())l.push("City/Address: "+$("ct").value.trim());
l.push("Inquiry type: "+$("ty").value);if($("nt").value.trim())l.push("Notes: "+$("nt").value.trim());return l.join("\n")}
function ok(){var m=$("msg");m.className="msg";
if(!P.some(function(x){return Q[x.id]>0})){m.className="msg err";m.textContent=T("e1");return false}
if(!$("nm").value.trim()||!$("ph").value.trim()){m.className="msg err";m.textContent=T("e2");return false}return true}
function cp(t){try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t)}catch(e){}
return new Promise(function(r,j){try{var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();r()}catch(e){j(e)}})}
$("copy").onclick=function(){if(!ok())return;cp(build()).then(function(){$("msg").textContent=T("ok1")}).catch(function(){})};
$("sw").onclick=function(){if(!ok())return;window.open("https://wa.me/923239613323?text="+encodeURIComponent(build()),"_blank")};
$("sm").onclick=function(){if(!ok())return;cp(build()).then(function(){$("msg").textContent=T("ok2")}).catch(function(){});window.open("https://m.me/ShaheenInternationalPharma","_blank")};
setIcon();applyLang();
